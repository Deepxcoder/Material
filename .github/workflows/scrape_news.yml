name: Daily News Scraper
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # This forces the update
on:
  schedule:
    - cron: '0 0 * * *'  # This runs every night at 12:00 AM UTC
  workflow_dispatch:      # This adds a "Run" button so you can test it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install newspaper3k firebase-admin requests
      - name: Create Firebase Key File
        run: |
          # 1. Force create the directory just in case
          mkdir -p scraper 
          
          # 2. Write the secret into the file
          echo "${{ secrets.FIREBASE_JSON_KEY }}" > scraper/firebase-key.json

      - name: Debug - List all files
        run: |
          echo "Current Directory Content:"
          ls -R
          
      - name: Run Scraper
        run: python scraper/scraper.py
