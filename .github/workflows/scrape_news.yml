name: Daily News Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install newspaper3k firebase-admin requests lxml_html_clean

      - name: Create Temporary Key File from Secret
        env:
          # We store the secret in a variable first to protect formatting
          RAW_JSON_KEY: ${{ secrets.FIREBASE_JSON_KEY }}
        run: |
          mkdir -p scraper
          # We use quotes around the variable to ensure it's written exactly as-is
          echo "$RAW_JSON_KEY" > scraper/firebase-key.json

      - name: Debug - Check JSON Start
        run: |
          # This prints the first 50 characters of the file
          head -c 50 scraper/firebase-key.json
          echo "...(rest of file hidden)"
      - name: Run Scraper
        run: python scraper/scraper.py
