name: Daily News Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install newspaper3k firebase-admin requests lxml_html_clean

      - name: Create Temporary Key File from Secret
        run: |
          # 1. Create the folder
          mkdir -p scraper
          # 2. Take the secret string and turn it into a physical file
          echo "${{ secrets.FIREBASE_JSON_KEY }}" > scraper/firebase-key.json

      - name: Run Scraper
        run: python scraper/scraper.py
