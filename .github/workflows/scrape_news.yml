name: Daily News Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install newspaper3k firebase-admin requests lxml_html_clean

      - name: Create Temporary Key File from Secret
        env:
          # We store the secret in an environment variable first
          FIREBASE_KEY_DATA: ${{ secrets.FIREBASE_JSON_KEY }}
        run: |
          mkdir -p scraper
          # We use the variable to write the file, which preserves formatting
          echo "$FIREBASE_KEY_DATA" > scraper/firebase-key.json

      - name: Debug JSON Format
        run: |
          # This will print the first few lines of the file so you can check the quotes
          head -n 5 scraper/firebase-key.json    

      - name: Run Scraper
        run: python scraper/scraper.py
