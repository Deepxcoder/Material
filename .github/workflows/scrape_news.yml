name: Daily News Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # This forces the update to Node 20+ support

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Adding lxml_html_clean solves the newspaper3k ImportError
          pip install newspaper3k firebase-admin requests lxml_html_clean

      - name: Prepare Workspace and Debug
        run: |
          # 1. Force create the directory just in case
          mkdir -p scraper
          
          # 2. Write the secret into the file
          echo "${{ secrets.FIREBASE_JSON_KEY }}" > scraper/firebase-key.json
          
          echo "--- FILE MAP ---"
          ls -R

      - name: Debug - List all files
        run: |
          echo "Current Working Directory:"
          pwd
          echo "Listing all files recursively:"
          ls -R
          
      - name: Run Scraper
        run: |
          # We search for the file and run it wherever it is (handles scraper vs scrapper folder)
          FILE_PATH=$(find . -name "scraper.py" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "Error: scraper.py not found anywhere!"
            exit 1
          fi
          python "$FILE_PATH"
