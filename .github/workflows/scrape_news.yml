name: Daily News Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install newspaper3k firebase-admin requests lxml_html_clean

      - name: Create Temporary Key File from Secret
        run: |
          mkdir -p scraper
          python3 << 'EOF'
          import json
          import os
    
          key_content = """${{ secrets.FIREBASE_JSON_KEY }}"""
          with open('scraper/firebase-key.json', 'w') as f:
            f.write(key_content)
          EOF

      - name: Debug - Check JSON Start
        run: |
          # This prints the first 50 characters of the file
          head -c 50 scraper/firebase-key.json
          echo "...(rest of file hidden)"
      - name: Run Scraper
        run: python scraper/scraper.py
