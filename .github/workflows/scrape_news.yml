name: Daily News Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install newspaper3k firebase-admin requests

      - name: Prepare Workspace and Debug
        run: |
          # Create the folder if it doesn't exist
          mkdir -p scraper
          echo "${{ secrets.FIREBASE_JSON_KEY }}" > scraper/firebase-key.json
          echo "--- FILE MAP ---"
          ls -R

      - name: Run Scraper
        run: |
          # We search for the file and run it wherever it is
          FILE_PATH=$(find . -name "scraper.py" | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "Error: scraper.py not found anywhere!"
            exit 1
          fi
          python "$FILE_PATH"